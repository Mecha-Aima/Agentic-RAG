# Replace image with: terraform output -raw ecr_api_repository_url
#   e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/rag-free-api
# Create pull secret: kubectl create secret docker-registry ecr-secret ...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-api
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: rag-api
          image: PLACEHOLDER_ECR_API_REPOSITORY_URL:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: rag-secrets
          readinessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-svc
spec:
  type: NodePort
  selector:
    app: rag-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
