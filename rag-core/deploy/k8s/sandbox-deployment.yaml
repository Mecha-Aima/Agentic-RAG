# Replace image with: terraform output -raw ecr_sandbox_repository_url
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-service
  template:
    metadata:
      labels:
        app: sandbox-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: sandbox
          image: PLACEHOLDER_ECR_SANDBOX_REPOSITORY_URL:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-service
spec:
  type: ClusterIP
  selector:
    app: sandbox-service
  ports:
    - port: 8080
      targetPort: 8080
